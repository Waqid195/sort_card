<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Game Card Sort - Unsur, Senyawa, dan Campuran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Funtastic';
      src: url('fonts/Funtastic.woff2') format('woff2'),
           url('fonts/Funtastic.ttf') format('truetype'),
           url('fonts/Funtastic.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #143d6b;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      max-height: 932px;
      position: relative;
      transform: translateZ(0);
      background-color: #5bb3f3;
      background-image: url('images/bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.38);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .music-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 50;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #0f3a6e;
      background: rgba(255, 255, 255, 0.92);
      color: #0f3a6e;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .music-toggle:active { transform: scale(0.92); }
    .music-toggle.hidden { opacity: 0; pointer-events: none; }

    .bg-animations {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .atom-spin {
      position: absolute;
      opacity: 0.22;
      will-change: transform;
    }

    .atom-1 { top: 2%;  left: 10%;  width: 12%; animation: spinCW 16s linear infinite; }
    .atom-2 { top: 3%;  right: 12%; width: 13%; animation: spinCCW 20s linear infinite; }
    .atom-3 { top: 25%; left: -3%;  width: 15%; animation: spinCCW 24s linear infinite; }
    .atom-4 { top: 27%; right: -3%; width: 14%; animation: spinCW 18s linear infinite; }
    .atom-5 { top: 53%; left: -2%;  width: 10%; animation: spinCW 14s linear infinite; }
    .atom-6 { top: 54%; right: -2%; width: 11%; animation: spinCCW 17s linear infinite; }

    .scientist-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
      transition: opacity 0.25s ease;
    }

    .scientist-layer.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .scientist-img {
      position: absolute;
      bottom: 15%;
      left: 14%;
      width: 30%;
      height: auto;
      display: block;
      animation: swaySoft 3.2s ease-in-out infinite;
    }

    .bg-foreground {
      position: fixed;
      bottom: -2%;
      left: 50%;
      transform: translateX(-50%);
      width: 128%;
      max-width: none;
      pointer-events: none;
      z-index: 3;
    }

    .bg-foreground img {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-6px); }
    }

    @keyframes swaySoft {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%      { transform: translateY(-4px) rotate(1.5deg); }
    }

    @keyframes popIn {
      0%   { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes menuDrop {
      0%   { transform: translateY(-8px) scale(0.95); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes binBounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }

    @keyframes btnShine {
      0%, 60% { left: -120%; }
      100%    { left: 160%; }
    }

    @keyframes btnPop {
      0%   { transform: scale(0.95) translateY(1px); }
      55%  { transform: scale(1.05) translateY(-1px); }
      100% { transform: scale(1) translateY(0); }
    }

    @keyframes rippleExpand {
      to {
        transform: scale(3.2);
        opacity: 0;
      }
    }

    @keyframes trophyGlowAura {
      0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.55; }
      50%      { transform: translate(-50%, -50%) scale(1.18); opacity: 0.95; }
    }

    @keyframes trophyShimmer {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(255, 223, 89, 0.7))
                drop-shadow(0 6px 10px rgba(0, 0, 0, 0.2))
                brightness(1);
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(255, 235, 115, 1))
                drop-shadow(0 0 32px rgba(255, 196, 0, 0.75))
                brightness(1.1);
      }
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: clamp(10px, 2vh, 18px) 12px clamp(10px, 2vh, 18px);
      position: relative;
      z-index: 4;
      overflow: hidden;
      animation: popIn 0.22s ease-out;
    }

    .screen.active { display: flex; }

    .title-img {
      width: 88%;
      max-width: 320px;
      max-height: 22vh;
      object-fit: contain;
      display: block;
      margin: 4px auto clamp(6px, 1.5vh, 12px);
      filter: drop-shadow(0 5px 10px rgba(15, 58, 110, 0.28));
      animation: floatSlow 3.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    .title-img-sm {
      width: 82%;
      max-width: 290px;
      max-height: 8vh;
      object-fit: contain;
      display: block;
      margin: 2px auto 4px;
      filter: drop-shadow(0 4px 8px rgba(15, 58, 110, 0.28));
      flex-shrink: 0;
    }

    .font-funtastic {
      font-family: 'Funtastic', 'Fredoka', cursive, sans-serif;
      letter-spacing: 1px;
    }

    .white-panel {
      width: 100%;
      background: rgba(255, 255, 255, 0.97);
      border: 2.5px solid #111827;
      border-radius: 20px;
      padding: clamp(10px, 1.6vh, 14px) 10px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #screen-start {
      justify-content: flex-start;
      padding-top: clamp(14px, 3vh, 26px);
    }

    .form-card {
      width: 90%;
      background: #ffffff;
      border-radius: 18px;
      padding: clamp(12px, 2vh, 18px);
      box-shadow: 0 10px 25px rgba(15, 58, 110, 0.25);
      margin-bottom: clamp(10px, 2vh, 18px);
      flex-shrink: 0;
    }

    .form-group { margin-bottom: clamp(8px, 1.4vh, 12px); }
    .form-group:last-child { margin-bottom: 0; }

    .form-group label {
      display: block;
      color: #0f3a6e;
      font-weight: 900;
      font-size: clamp(0.88rem, 2.2vh, 0.98rem);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: clamp(7px, 1.2vh, 10px) 12px;
      border-radius: 10px;
      border: 1.8px solid #5a8ec7;
      background: #edf5ff;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(0.88rem, 2vh, 0.98rem);
      font-weight: 700;
      color: #0f3a6e;
      outline: none;
    }

    .form-group input:focus {
      border-color: #0f3a6e;
      background: #ffffff;
    }

    .btn {
      position: relative;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      border: 2px solid #111827;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s ease, filter 0.12s ease;
      box-shadow: 0 1px 0 #0f294a, 0 2px 4px rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-20deg);
      pointer-events: none;
    }

    .btn-pulse::after { animation: btnShine 2.8s ease-in-out infinite; }

    .btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 0 0 #0f294a, 0 1px 2px rgba(0, 0, 0, 0.12);
      filter: brightness(1.06);
    }

    .btn.clicked-pop {
      animation: btnPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: scale(0);
      pointer-events: none;
      animation: rippleExpand 0.48s ease-out forwards;
    }

    .btn-green {
      background: linear-gradient(180deg, #62c42a 0%, #2f9623 100%);
      color: #ffffff;
      padding: clamp(8px, 1.4vh, 11px) 22px;
      font-size: clamp(0.88rem, 2vh, 1.02rem);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      box-shadow: 0 1px 0 #1c6314, 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .btn-green:active {
      box-shadow: 0 0 0 #1c6314, 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .btn-orange {
      background: linear-gradient(180deg, #ffca3a 0%, #f5921d 100%);
      color: #ffffff;
      padding: clamp(7px, 1.2vh, 10px) 16px;
      font-size: clamp(0.84rem, 1.9vh, 0.95rem);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      box-shadow: 0 1px 0 #b86209, 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .btn-orange:active {
      box-shadow: 0 0 0 #b86209, 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .btn-blue {
      background: linear-gradient(180deg, #3b9eff 0%, #1565c0 100%);
      color: #ffffff;
      padding: clamp(7px, 1.2vh, 10px) 16px;
      font-size: clamp(0.84rem, 1.9vh, 0.95rem);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      box-shadow: 0 1px 0 #0c3d7a, 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .btn-blue:active {
      box-shadow: 0 0 0 #0c3d7a, 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .btn-pulse { animation: pulseBtn 2.2s ease-in-out infinite; }

    .credit-pill {
      margin-top: auto;
      background: #ffffff;
      color: #0f3a6e;
      font-weight: 800;
      font-size: clamp(0.78rem, 1.8vh, 0.88rem);
      padding: 5px 22px;
      border-radius: 999px;
      border: 2px solid #111827;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
      flex-shrink: 0;
    }

    .game-topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 0;
      position: relative;
      z-index: 30;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hamburger-btn {
      background: transparent;
      border: none;
      width: 36px;
      height: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 2px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .hamburger-btn:active { transform: scale(0.9); }

    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 4px;
      background: #111827;
      border-radius: 4px;
    }

    .hud-score {
      color: #111827;
      font-weight: 900;
      font-size: clamp(1.05rem, 2.3vh, 1.25rem);
    }

    .btn-finish-top {
      border-radius: 10px;
      padding: clamp(6px, 1vh, 8px) clamp(20px, 5vw, 30px);
      font-size: clamp(0.88rem, 2vh, 1rem);
    }

    .game-menu-dropdown {
      display: none;
      position: absolute;
      top: 44px;
      left: 2px;
      width: 210px;
      background: #ffffff;
      border: 2.2px solid #111827;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 10px 24px rgba(15, 58, 110, 0.28);
      flex-direction: column;
      gap: 6px;
      z-index: 60;
      animation: menuDrop 0.18s ease-out;
    }

    .game-menu-dropdown.open { display: flex; }

    .menu-item {
      width: 100%;
      background: #edf5ff;
      border: 1.6px solid #5a8ec7;
      border-radius: 10px;
      padding: 10px 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 800;
      color: #0f3a6e;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.1s ease;
    }

    .menu-item:active {
      transform: scale(0.97);
      background: #d8ebff;
    }

    .bins-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: auto;
      margin-bottom: clamp(12px, 2vh, 18px);
      flex-shrink: 0;
    }

    .bin-zone {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 14px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .bin-zone img {
      width: 100%;
      max-width: 114px;
      max-height: 16vh;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .bin-zone.drag-over {
      transform: scale(1.09) translateY(-4px);
      filter: drop-shadow(0 0 12px #ffe066);
    }

    .bin-zone.just-dropped { animation: binBounce 0.35s ease; }

    .bin-count {
      position: absolute;
      top: 0;
      right: 6px;
      background: #ffc82c;
      color: #0f3a6e;
      border: 2px solid #0f3a6e;
      font-size: 0.75rem;
      font-weight: 900;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .game-panel {
      width: 95%;
      flex: none;
      margin-top: 0;
      margin-bottom: auto;
      padding: 10px 8px;
    }

    .panel-title {
      text-align: center;
      color: #0f3a6e;
      font-weight: 900;
      font-size: clamp(0.98rem, 2.2vh, 1.15rem);
      margin-bottom: 2px;
      flex-shrink: 0;
    }

    .panel-desc {
      text-align: center;
      color: #164982;
      font-weight: 800;
      font-size: clamp(0.74rem, 1.7vh, 0.84rem);
      margin-bottom: clamp(6px, 1.2vh, 10px);
      flex-shrink: 0;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-auto-rows: min-content;
      align-content: center;
      min-height: 32vh;
      gap: 6px 5px;
    }

    .card-item {
      width: 100%;
      aspect-ratio: 5 / 6;
      max-height: 14.5vh;
      background: #e6f2ff;
      border: 2px solid #2b7bc0;
      border-radius: 10px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(0.58rem, 1.5vh, 0.68rem);
      line-height: 1.15;
      font-weight: 900;
      color: #0f3a6e;
      cursor: grab;
      touch-action: none;
      overflow: hidden;
      word-break: normal;
      overflow-wrap: break-word;
      box-shadow: 0 3px 6px rgba(15, 58, 110, 0.12);
      transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.15s ease;
    }

    .card-item .formula {
      font-size: clamp(0.5rem, 1.25vh, 0.59rem);
      font-weight: 800;
      margin-top: 2px;
      white-space: nowrap;
      color: #144985;
    }

    .card-item sub { font-size: 0.72em; line-height: 0; }

    .card-item.dragging-ghost {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      width: 72px;
      height: 86px;
      transform: scale(1.1) rotate(-3deg);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.32);
      background: #ffffff;
      border-color: #f5921d;
    }

    .card-item.placeholder { opacity: 0.2; }

    .empty-msg {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1b5ea3;
      font-weight: 800;
      font-size: 0.94rem;
      text-align: center;
      padding: 16px;
      line-height: 1.5;
    }

    .trophy-wrap {
      position: relative;
      z-index: 2;
      margin-bottom: -24px;
      animation: floatSlow 2.6s ease-in-out infinite;
      flex-shrink: 0;
    }

    .trophy-wrap::before {
      content: '';
      position: absolute;
      top: 46%;
      left: 50%;
      width: clamp(95px, 14vh, 135px);
      height: clamp(95px, 14vh, 135px);
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255, 245, 160, 0.9) 0%,
        rgba(255, 210, 50, 0.45) 45%,
        rgba(255, 200, 0, 0) 72%);
      z-index: -1;
      pointer-events: none;
      animation: trophyGlowAura 2.2s ease-in-out infinite;
    }

    .trophy-wrap img {
      height: clamp(64px, 11vh, 96px);
      width: auto;
      display: block;
      animation: trophyShimmer 2.2s ease-in-out infinite;
    }

    .result-panel {
      flex: 1;
      min-height: 0;
      padding-top: 28px;
      margin-bottom: 8px;
      justify-content: space-between;
    }

    .score-banner {
      text-align: center;
      font-size: clamp(1.45rem, 3.2vh, 2rem);
      font-weight: 700;
      color: #ffc82c;
      -webkit-text-stroke: 4px #0f3a6e;
      paint-order: stroke fill;
      text-shadow: 0 3px 0 #0f3a6e;
      margin-bottom: 2px;
      line-height: 1.15;
      flex-shrink: 0;
    }

    .player-meta {
      text-align: center;
      font-size: clamp(0.74rem, 1.6vh, 0.84rem);
      font-weight: 800;
      color: #2b5c94;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .result-boxes-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .result-box {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f2f8ff;
      border: 1.8px solid #5294d6;
      border-radius: 12px;
      padding: 6px 10px;
      overflow: hidden;
    }

    .result-box img {
      width: clamp(38px, 6.5vh, 52px);
      height: auto;
      flex-shrink: 0;
    }

    .result-list {
      list-style: none;
      width: 100%;
      font-size: clamp(0.66rem, 1.5vh, 0.8rem);
      font-weight: 800;
      color: #0f3a6e;
      line-height: 1.2;
    }

    .result-list li {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 2px;
    }

    .badge-ok { color: #1ea83c; font-size: 0.85rem; }
    .badge-no { color: #e53935; font-size: 0.85rem; }

    .action-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .action-row .btn {
      padding: clamp(7px, 1.2vh, 10px) 8px;
      font-size: clamp(0.78rem, 1.7vh, 0.88rem);
      line-height: 1.15;
      text-align: center;
    }

    .action-full {
      width: 100%;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .eval-panel {
      flex: 1;
      min-height: 0;
      margin-bottom: 10px;
      justify-content: space-between;
    }

    #eval-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .eval-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #ebf5ff;
      border: 2px solid #3c86cc;
      border-radius: 14px;
      padding: clamp(8px, 1.4vh, 12px) 12px;
      color: #0f3a6e;
      font-weight: 800;
      font-size: clamp(0.78rem, 1.8vh, 0.92rem);
      line-height: 1.4;
    }

    .eval-box-title {
      font-weight: 900;
      margin-bottom: 3px;
      color: #0a2e5c;
    }
  </style>
</head>
<body>
  <audio id="bgm-audio" src="audio/bgm.mp3" loop preload="auto"></audio>

  <div class="app-container">
    <button class="music-toggle" id="btn-music" title="Nyalakan / Matikan Musik">🔇</button>

    <div class="bg-animations" aria-hidden="true">
      <img src="images/unsur.png" class="atom-spin atom-1" alt="" />
      <img src="images/unsur.png" class="atom-spin atom-2" alt="" />
      <img src="images/unsur.png" class="atom-spin atom-3" alt="" />
      <img src="images/unsur.png" class="atom-spin atom-4" alt="" />
      <img src="images/unsur.png" class="atom-spin atom-5" alt="" />
      <img src="images/unsur.png" class="atom-spin atom-6" alt="" />
    </div>

    <div class="scientist-layer" id="scientist-layer" aria-hidden="true">
      <img src="images/orang.png" alt="Ilustrasi Ilmuwan" class="scientist-img" />
    </div>

    <div class="bg-foreground" aria-hidden="true">
      <img src="images/bg_dpn.png" alt="" />
    </div>

    <section id="screen-start" class="screen active">
      <img src="images/judul.png" alt="Game Card Sort - Unsur, Senyawa, dan Campuran" class="title-img" />

      <div class="form-card">
        <div class="form-group">
          <label for="input-nama">Masukkan Namamu</label>
          <input type="text" id="input-nama" placeholder="Ketik namamu..." autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="input-kelas">Kelas</label>
          <input type="text" id="input-kelas" placeholder="Contoh: VIII-A" autocomplete="off" />
        </div>
      </div>

      <button class="btn btn-green btn-pulse" id="btn-start">
        MULAI BERMAIN <span>▶</span>
      </button>

      <div class="credit-pill">Oleh Faidatul Mawaddah</div>
    </section>

    <section id="screen-game" class="screen">
      <div class="game-topbar">
        <div class="topbar-left">
          <button class="hamburger-btn" id="btn-game-menu" aria-label="Buka Menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div class="hud-score">Poin: <span id="live-score">0</span></div>
        </div>

        <button class="btn btn-orange btn-finish-top" id="btn-finish">Selesai</button>

        <div class="game-menu-dropdown" id="game-menu-dropdown">
          <button class="menu-item" id="menu-toggle-audio">🔇 Nyalakan Audio</button>
          <button class="menu-item" id="menu-reset">↻ Reset Permainan</button>
          <button class="menu-item" id="menu-home">🏠 Kembali ke Beranda</button>
        </div>
      </div>

      <div class="bins-row">
        <div class="bin-zone" data-bin="unsur">
          <img src="images/bin-unsur.png" alt="Unsur" />
          <span class="bin-count" id="count-unsur">0</span>
        </div>
        <div class="bin-zone" data-bin="senyawa">
          <img src="images/bin-senyawa.png" alt="Senyawa" />
          <span class="bin-count" id="count-senyawa">0</span>
        </div>
        <div class="bin-zone" data-bin="campuran">
          <img src="images/bin-campuran.png" alt="Campuran" />
          <span class="bin-count" id="count-campuran">0</span>
        </div>
      </div>

      <div class="white-panel game-panel">
        <div class="panel-title">TUMPUKAN KARTU</div>
        <div class="panel-desc">Seret dan cocokkan kartu ke wadah yang benar!</div>
        <div class="cards-grid" id="cards-grid"></div>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <img src="images/skor.png" alt="Permainan Selesai" class="title-img-sm" />

      <div class="trophy-wrap">
        <img src="images/trophy.png" alt="Piala" />
      </div>

      <div class="white-panel result-panel">
        <div class="score-banner font-funtastic">
          SKOR <span id="final-score">0</span>/<span id="max-score">150</span>
        </div>
        <div class="player-meta" id="player-meta"></div>

        <div class="result-boxes-wrap">
          <div class="result-box">
            <img src="images/bin-unsur.png" alt="Unsur" />
            <ul class="result-list" id="res-unsur"></ul>
          </div>
          <div class="result-box">
            <img src="images/bin-senyawa.png" alt="Senyawa" />
            <ul class="result-list" id="res-senyawa"></ul>
          </div>
          <div class="result-box">
            <img src="images/bin-campuran.png" alt="Campuran" />
            <ul class="result-list" id="res-campuran"></ul>
          </div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn btn-orange" id="btn-to-eval">Lihat Evaluasi<br>Lengkap</button>
        <button class="btn btn-green" id="btn-play-again">Main Lagi</button>
      </div>
      <button class="btn btn-blue action-full" id="btn-back-menu">
        Kembali ke Beranda
      </button>
    </section>

    <section id="screen-evaluation" class="screen">
      <img src="images/hasil.png" alt="Hasil Evaluasi" class="title-img-sm" />

      <div class="white-panel eval-panel">
        <div class="panel-title" style="margin-bottom: 10px;">KUNCI JAWABAN</div>
        <div id="eval-container"></div>
      </div>

      <div class="action-row">
        <button class="btn btn-orange" id="btn-back-result">← Kembali</button>
        <button class="btn btn-green" id="btn-eval-replay">Main Lagi</button>
      </div>
      <button class="btn btn-blue action-full" id="btn-eval-menu">
        Kembali ke Beranda
      </button>
    </section>
  </div>

  <script src="data.js"></script>
  <script>
    let audioCtx = null;
    let isMusicOn = false;
    let synthInterval = null;
    let mp3Available = true;
    const bgmAudio = document.getElementById('bgm-audio');
    const btnMusic = document.getElementById('btn-music');
    const menuToggleAudio = document.getElementById('menu-toggle-audio');

    bgmAudio.volume = 0.35;
    bgmAudio.addEventListener('error', () => { mp3Available = false; });

    function initAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSfx(type) {
      if (!isMusicOn) return;
      initAudioCtx();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'drop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.09);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'finish') {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, now + i * 0.1);
          g.gain.setValueAtTime(0.15, now + i * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.25);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(now + i * 0.1);
          o.stop(now + i * 0.1 + 0.25);
        });
      }
    }

    function playClickSfx() {
      if (!isMusicOn) return;
      initAudioCtx();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.06);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }

    const MELODY_NOTES = [523, 659, 784, 659, 880, 784, 659, 587, 523, 587, 659, 784, 659, 587, 523, 0];
    let noteIndex = 0;

    function startSynthBgm() {
      if (synthInterval) return;
      initAudioCtx();
      synthInterval = setInterval(() => {
        if (!isMusicOn) return;
        const freq = MELODY_NOTES[noteIndex % MELODY_NOTES.length];
        noteIndex++;
        if (freq > 0) {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.055, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.23);
        }
      }, 280);
    }

    function stopSynthBgm() {
      clearInterval(synthInterval);
      synthInterval = null;
    }

    function setMusic(state) {
      isMusicOn = state;
      btnMusic.textContent = isMusicOn ? '🔊' : '🔇';
      menuToggleAudio.textContent = isMusicOn ? '🔊 Matikan Audio' : '🔇 Nyalakan Audio';
      if (isMusicOn) {
        if (mp3Available) {
          bgmAudio.play().catch(() => {
            mp3Available = false;
            startSynthBgm();
          });
        } else {
          startSynthBgm();
        }
      } else {
        bgmAudio.pause();
        stopSynthBgm();
      }
    }

    btnMusic.addEventListener('click', () => setMusic(!isMusicOn));

    function buildAllCards() {
      let id = 1;
      const mapItem = (item, category) => ({
        id: id++,
        category,
        cardHtml: `<span>${item.nama}</span>${item.rumus ? `<span class="formula">${item.rumus}</span>` : ''}`,
        listHtml: item.rumus ? `${item.nama} ${item.rumus}` : item.nama
      });

      const all = [
        ...DATA_UNSUR.map(i => mapItem(i, 'unsur')),
        ...DATA_SENYAWA.map(i => mapItem(i, 'senyawa')),
        ...DATA_CAMPURAN.map(i => mapItem(i, 'campuran'))
      ];

      for (let i = all.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [all[i], all[j]] = [all[j], all[i]];
      }
      return all;
    }

    function renderEvaluationKey() {
      const container = document.getElementById('eval-container');
      const sections = [
        { title: `Unsur (${DATA_UNSUR.length} kartu):`, list: DATA_UNSUR },
        { title: `Senyawa (${DATA_SENYAWA.length} kartu):`, list: DATA_SENYAWA },
        { title: `Campuran (${DATA_CAMPURAN.length} kartu):`, list: DATA_CAMPURAN }
      ];

      container.innerHTML = sections.map(sec => {
        const text = sec.list
          .map(i => i.rumus ? `${i.nama} ${i.rumus}` : i.nama)
          .join(', ') + '.';
        return `
          <div class="eval-box">
            <div class="eval-box-title">${sec.title}</div>
            <div>${text}</div>
          </div>
        `;
      }).join('');
    }

    let playerName = '';
    let playerClass = '';
    let totalCards = 0;
    let remainingCards = [];
    let placements = { unsur: [], senyawa: [], campuran: [] };
    let score = 0;

    const gameMenuDropdown = document.getElementById('game-menu-dropdown');
    const btnGameMenu = document.getElementById('btn-game-menu');

    function closeGameMenu() {
      gameMenuDropdown.classList.remove('open');
    }

    btnGameMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      playClickSfx();
      gameMenuDropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!gameMenuDropdown.contains(e.target) && !btnGameMenu.contains(e.target)) {
        closeGameMenu();
      }
    });

    menuToggleAudio.addEventListener('click', (e) => {
      e.stopPropagation();
      setMusic(!isMusicOn);
    });

    document.getElementById('menu-reset').addEventListener('click', () => {
      playClickSfx();
      closeGameMenu();
      startGame();
    });

    document.getElementById('menu-home').addEventListener('click', () => {
      playClickSfx();
      closeGameMenu();
      showScreen('screen-start');
    });

    function showScreen(id) {
      closeGameMenu();
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('scientist-layer').classList.toggle('hidden', id !== 'screen-start');
      btnMusic.classList.toggle('hidden', id === 'screen-game');
    }

    function startGame() {
      remainingCards = buildAllCards();
      totalCards = remainingCards.length;
      placements = { unsur: [], senyawa: [], campuran: [] };
      score = 0;
      updateHUD();
      renderCards();
      renderEvaluationKey();
      showScreen('screen-game');
    }

    function updateHUD() {
      document.getElementById('live-score').textContent = score;
      document.getElementById('count-unsur').textContent = placements.unsur.length;
      document.getElementById('count-senyawa').textContent = placements.senyawa.length;
      document.getElementById('count-campuran').textContent = placements.campuran.length;
    }

    function renderCards() {
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      if (remainingCards.length === 0) {
        grid.innerHTML = `
          <div class="empty-msg">
            Semua kartu sudah dimasukkan!<br>
            Tekan tombol <b>Selesai</b> di atas untuk melihat skor.
          </div>
        `;
        return;
      }

      remainingCards.forEach(card => {
        const el = document.createElement('div');
        el.className = 'card-item';
        el.innerHTML = card.cardHtml;
        el.dataset.id = card.id;
        attachPointerDrag(el, card);
        grid.appendChild(el);
      });
    }

    function attachPointerDrag(el, card) {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        closeGameMenu();
        const ghost = el.cloneNode(true);
        ghost.classList.add('dragging-ghost');
        document.body.appendChild(ghost);
        el.classList.add('placeholder');

        const moveGhost = (clientX, clientY) => {
          ghost.style.left = (clientX - ghost.offsetWidth / 2) + 'px';
          ghost.style.top = (clientY - ghost.offsetHeight / 2) + 'px';

          document.querySelectorAll('.bin-zone').forEach(bin => {
            const rect = bin.getBoundingClientRect();
            const isOver = clientX >= rect.left && clientX <= rect.right &&
                           clientY >= rect.top && clientY <= rect.bottom;
            bin.classList.toggle('drag-over', isOver);
          });
        };

        moveGhost(e.clientX, e.clientY);

        const onPointerMove = (ev) => moveGhost(ev.clientX, ev.clientY);

        const onPointerUp = (ev) => {
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);

          let droppedBin = null;
          let droppedEl = null;
          document.querySelectorAll('.bin-zone').forEach(bin => {
            const rect = bin.getBoundingClientRect();
            if (ev.clientX >= rect.left && ev.clientX <= rect.right &&
                ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
              droppedBin = bin.dataset.bin;
              droppedEl = bin;
            }
            bin.classList.remove('drag-over');
          });

          ghost.remove();

          if (droppedBin) {
            placements[droppedBin].push(card);
            if (card.category === droppedBin) {
              score += 10;
            }
            remainingCards = remainingCards.filter(c => c.id !== card.id);
            updateHUD();
            renderCards();
            playSfx('drop');

            if (droppedEl) {
              droppedEl.classList.remove('just-dropped');
              void droppedEl.offsetWidth;
              droppedEl.classList.add('just-dropped');
            }
          } else {
            el.classList.remove('placeholder');
          }
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      });
    }

    function finishGame() {
      playSfx('finish');
      document.getElementById('final-score').textContent = score;
      document.getElementById('max-score').textContent = totalCards * 10;

      const meta = (playerName || playerClass)
        ? `${playerName || 'Pemain'}${playerClass ? ' • Kelas ' + playerClass : ''}`
        : '';
      document.getElementById('player-meta').textContent = meta;

      ['unsur', 'senyawa', 'campuran'].forEach(binKey => {
        const ul = document.getElementById(`res-${binKey}`);
        ul.innerHTML = '';

        if (placements[binKey].length === 0) {
          ul.innerHTML = '<li style="color:#8aa7c7; font-style:italic;">Belum ada kartu</li>';
          return;
        }

        placements[binKey].forEach(card => {
          const isCorrect = card.category === binKey;
          const li = document.createElement('li');
          li.innerHTML = `
            <span class="${isCorrect ? 'badge-ok' : 'badge-no'}">${isCorrect ? '✔' : '✖'}</span>
            <span>${card.listHtml}</span>
          `;
          ul.appendChild(li);
        });
      });

      showScreen('screen-result');
    }

    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement('span');
        ripple.className = 'btn-ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 500);

        btn.classList.remove('clicked-pop');
        void btn.offsetWidth;
        btn.classList.add('clicked-pop');

        playClickSfx();
      });
    });

    document.getElementById('btn-start').addEventListener('click', () => {
      playerName = document.getElementById('input-nama').value.trim();
      playerClass = document.getElementById('input-kelas').value.trim();
      if (!isMusicOn) setMusic(true);
      startGame();
    });

    document.getElementById('btn-finish').addEventListener('click', finishGame);
    document.getElementById('btn-to-eval').addEventListener('click', () => showScreen('screen-evaluation'));
    document.getElementById('btn-back-result').addEventListener('click', () => showScreen('screen-result'));
    document.getElementById('btn-play-again').addEventListener('click', startGame);
    document.getElementById('btn-eval-replay').addEventListener('click', startGame);
    document.getElementById('btn-back-menu').addEventListener('click', () => showScreen('screen-start'));
    document.getElementById('btn-eval-menu').addEventListener('click', () => showScreen('screen-start'));
  </script>
</body>
</html>
